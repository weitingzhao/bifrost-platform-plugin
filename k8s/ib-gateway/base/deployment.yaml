apiVersion: apps/v1
kind: Deployment
metadata:
  name: ib-gateway
  labels:
    app.kubernetes.io/name: ib-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ib-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ib-gateway
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ib-gateway
          # Registry pull. The tag is the build name; after bifrost-build-ib-gateway
          # finishes, replace it with @sha256:<digest result> before applying.
          # Do not import a laptop image with ctr — that path has no digest and no git SHA.
          # TD-282: the registry was emptied on 2026-10-10 and the old digest could
          # no longer be pulled; 0.4.0 was rebuilt from the same commit into the
          # now persistent registry, hence a new digest.
          image: 192.168.10.73:30500/bifrost-platform-plugin-ib-gateway@sha256:3395fb7c064fe4c013682895ebabd60425f0e6da70b28e1f77ac846793cb82c7  # 0.4.0 rebuilt (bifrost-build-ib-gateway-ggxv6, 30bd974)
          imagePullPolicy: Always
          env:
            - name: IB_GATEWAY_CONFIG
              value: /config/gateway.yaml
            - name: REDIS_IB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ib-gateway-redis
                  key: password
            - name: IB_GATEWAY_MODE
              valueFrom:
                configMapKeyRef:
                  name: ib-gateway-config
                  key: mode
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /config/gateway.yaml
              subPath: gateway.yaml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis,os; r=redis.Redis(host='redis-ib.data.svc.cluster.local',username='ib-gateway',password=os.environ['REDIS_IB_PASSWORD']); r.ping()"
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: config
          configMap:
            name: ib-gateway-config
